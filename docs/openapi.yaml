  /comisiones/{comisionId}/reversion:
    post:
      tags: [Comisiones]
      operationId: revertirComision
      summary: Revierte una comisión pendiente
      description: |
        Registra el motivo y el estado observado, marca la comisión como
        REVERTIDA sin eliminar el registro original y publica
        `ComisionRevertida`.

        Solo se revierte una comisión PENDIENTE. Si ya fue LIQUIDADA, la
        política abierta de APF2 se resuelve aquí rechazando el ajuste con
        `409`: la corrección exige un movimiento inverso auditado, fuera de
        este corte.
      security:
        - bearerAuth: []
      x-required-roles: [administracion, compliance]
      parameters:
        - $ref: '#/components/parameters/ComisionId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReversionCreate'
      responses:
        '200':
          description: Comisión revertida.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comision'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: La comisión ya está revertida o liquidada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'


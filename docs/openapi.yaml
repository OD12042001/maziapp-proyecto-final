      responses:
        '200':
          description: |
            Catálogo completo ordenado por `orden`. Incluye las etapas
            inactivas con `activo: false` para que el cliente distinga
            "no existe" de "está desactivada"; solo las activas son
            destinos válidos de avance.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Etapa'

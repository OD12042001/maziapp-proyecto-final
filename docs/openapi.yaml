  /pipeline/oportunidades:
    get:
      tags: [Pipeline]
      operationId: listarOportunidades
      summary: Lista oportunidades del pipeline
      description: |
        El freelance ve únicamente su cartera. Dirección Comercial y
        Gerencia General ven todas las oportunidades.
      security:
        - bearerAuth: []
      x-required-roles: [ejecutivo_inversion, direccion_comercial, gerencia_general]
      parameters:
        - name: estado
          in: query

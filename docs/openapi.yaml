  /pipeline/oportunidades/{oportunidadId}/avanzar:
    post:
      tags: [Pipeline]
      operationId: avanzarEtapaOportunidad
      summary: Avanza la oportunidad a la etapa siguiente
      description: |
        Solo se permite el avance secuencial. Para llegar a la etapa que
        permite cierre se exige el KYC en estado VALIDADO; si no se cumple,
        responde `409`. El cambio publica `EtapaCambiada` en el outbox y se
        registra en la auditoría.
      security:
        - bearerAuth: []
      x-required-roles: [ejecutivo_inversion]
      parameters:
        - $ref: '#/components/parameters/OportunidadId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvanzarEtapaRequest'
      responses:
        '200':
          description: Oportunidad actualizada.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Oportunidad'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            La etapa destino no es la siguiente, la oportunidad ya cerró o
            el KYC no está validado cuando la etapa lo exige.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          $ref: '#/components/responses/InternalError'


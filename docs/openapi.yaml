  /kyc/expedientes/{expedienteId}/dictamen:
    post:
      tags: [KYC]
      operationId: dictaminarExpedienteKyc
      summary: Emite el dictamen global del expediente
      description: |
        Solo Compliance. Un dictamen VALIDADO exige que todos los
        documentos obligatorios estén VALIDADOS; si no, responde `409`. El
        estado aprobado habilita el avance del pipeline y publica
        `KycEstadoCambiado`.
      security:
        - bearerAuth: []
      x-required-roles: [compliance]
      parameters:
        - $ref: '#/components/parameters/ExpedienteId'
        - $ref: '#/components/parameters/CorrelationId'

        '500':
          $ref: '#/components/responses/InternalError'

  /kyc/expedientes/{expedienteId}/documentos/{documentoId}:
    patch:
      tags: [KYC]
      operationId: revisarDocumentoKyc
      summary: Cambia el estado de revisión de un documento
      description: |
        Solo Compliance puede pasar un documento a VALIDADO o RECHAZADO.
        El freelance asignado solo puede registrar la recepción. Un rechazo
        exige observación.
      security:
        - bearerAuth: []
      x-required-roles: [ejecutivo_inversion, compliance]
      parameters:
        - $ref: '#/components/parameters/ExpedienteId'
        - $ref: '#/components/parameters/DocumentoId'
        - $ref: '#/components/parameters/CorrelationId'

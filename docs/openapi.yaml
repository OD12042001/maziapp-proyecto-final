        - name: etapaCodigo
          in: query
          required: false
          schema:
            type: string
        - name: contactoId
          in: query
          required: false
          schema:
            type: integer
        - name: responsableId
          in: query
          required: false
          description: Solo aplica a roles con visibilidad de cartera ajena.
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Página de oportunidades.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OportunidadPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Pipeline]
      operationId: crearOportunidad
      summary: Crea una oportunidad en la primera etapa
      description: |
        El responsable es el usuario autenticado. La oportunidad nace en
        la primera etapa activa del catálogo y en estado ACTIVA.
      security:
        - bearerAuth: []
      x-required-roles: [ejecutivo_inversion]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:

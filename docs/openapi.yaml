  /cierres:
    get:
      tags: [Cierres]
      operationId: listarCierres
      summary: Lista cierres de inversión
      description: |
        El freelance solo ve los cierres de su cartera. Dirección
        Comercial, Administración y Gerencia General ven todos.
      security:
        - bearerAuth: []
      x-required-roles: [ejecutivo_inversion, direccion_comercial, administracion, gerencia_general]
      parameters:
        - name: proyectoId
          in: query
          required: false
          schema:
            type: integer
        - name: freelanceId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: estado
          in: query
          required: false
          schema:
            type: string
            enum: [REGISTRADO, ANULADO]
        - name: desde
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: hasta
          in: query
          required: false
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Página de cierres.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CierrePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Cierres]
      operationId: registrarCierre
      summary: Registra el cierre ganado de una inversión
      description: |
        Precondiciones: la oportunidad pertenece a la cartera del usuario,
        el KYC está VALIDADO y la oportunidad está en la etapa que permite
        cierre. Solo se admite un cierre por oportunidad.

        El cierre y el evento `CierreGanadoRegistrado` se guardan en la
        misma transacción (outbox). El cálculo de la comisión (S16) ocurre
        al consumir el evento. La clave `Idempotency-Key` evita duplicados
        si el cliente reintenta.
      security:
        - bearerAuth: []
      x-required-roles: [ejecutivo_inversion]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CierreCreate'
      responses:
        '201':
          description: Cierre registrado.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cierre'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Ya existe un cierre para la oportunidad, el KYC no está
            validado o el proyecto no está activo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'


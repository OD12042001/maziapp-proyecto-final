  /comisiones/{comisionId}:
    get:
      tags: [Comisiones]
      operationId: obtenerComision
      summary: Obtiene una comisión y su reversión, si existe
      security:
        - bearerAuth: []
      x-required-roles: [ejecutivo_inversion, direccion_comercial, administracion, gerencia_general]
      parameters:
        - $ref: '#/components/parameters/ComisionId'
      responses:

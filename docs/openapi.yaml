        PENDIENTES o FALLIDOS cuyo `proximoIntentoUtc` ya venció, aplica
        reintentos con backoff exponencial y mueve a MUERTO al agotar
        `ESB_MAX_REINTENTOS`. Los consumidores son idempotentes por
        (`outboxId`, consumidor).
      security:
        - bearerAuth: []
      x-required-roles: [administracion]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutboxProcesarRequest'

# Mazi Flow - entorno local de base de datos
#
# Levanta SQL Server 2022 (Developer) en Docker para no depender de Azure.
#   docker compose up -d
#   ./database/init-local.ps1      # crea la BD, aplica esquema y seed
#
# La imagen oficial de SQL Server NO ejecuta /docker-entrypoint-initdb.d
# automaticamente (a diferencia de Postgres). Por eso la carga del esquema
# vive en database/init-local.ps1.

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: maziapp-sql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      # Solo entorno local. Sobrescribible con la variable de entorno
      # MSSQL_SA_PASSWORD (ver .env.example).
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-MaziLocal#2026}"
    ports:
      # 14333 en el host para no chocar con una instancia local de SQL Server.
      - "14333:1433"
    volumes:
      - maziapp-mssql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  maziapp-mssql-data:
    name: maziapp-mssql-data

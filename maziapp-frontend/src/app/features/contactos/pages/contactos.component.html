<fd-dynamic-page>
  <!-- HEADER -->
  <fd-dynamic-page-header title="Contactos"> </fd-dynamic-page-header>

  <!-- CONTENT -->
  <fd-dynamic-page-content>
    <fd-busy-indicator [loading]="loading">
      <table fd-table class="is-cozy full-width-table">
        <!-- HEADER -->
        <thead fd-table-header>
          <tr fd-table-row>
            <!-- DNI -->
            <th fd-table-cell>
              DNI

              <fd-input-group glyph="filter" placement="before" fdCompact>
                <input
                  fd-input-group-input
                  type="text"
                  [(ngModel)]="filtroDni"
                  (input)="aplicarFiltros()"
                />
              </fd-input-group>
            </th>

            <!-- NOMBRES -->
            <th fd-table-cell>
              Nombres

              <fd-input-group glyph="filter" placement="before" fdCompact>
                <input
                  fd-input-group-input
                  type="text"
                  [(ngModel)]="filtroNombres"
                  (input)="aplicarFiltros()"
                />
              </fd-input-group>
            </th>

            <!-- APELLIDOS -->
            <th fd-table-cell>
              Apellidos

              <fd-input-group glyph="filter" placement="before" fdCompact>
                <input
                  fd-input-group-input
                  type="text"
                  [(ngModel)]="filtroApellidos"
                  (input)="aplicarFiltros()"
                />
              </fd-input-group>
            </th>

            <!-- CORREO -->
            <th fd-table-cell>Correo</th>

            <!-- TELEFONO -->
            <th fd-table-cell>Teléfono</th>

            <!-- REGISTRO -->
            <th fd-table-cell>Registrado</th>

            <th fd-table-cell></th>
          </tr>
        </thead>

        <!-- BODY -->
        <tbody fd-table-body>
          <tr fd-table-row *ngFor="let c of contactosPaginados">
            <!-- DNI -->
            <td fd-table-cell>
              {{ c.numeroDocumento }}
            </td>

            <!-- NOMBRES (persona natural: nombres; empresa: razón social) -->
            <td fd-table-cell>
              {{ c.tipoContacto === 'JURIDICA' ? c.razonSocial : c.nombres }}
            </td>

            <!-- APELLIDOS (solo aplica a persona natural) -->
            <td fd-table-cell>
              {{ c.apellidos }}
            </td>

            <!-- CORREO -->
            <td fd-table-cell>
              {{ c.correo }}
            </td>

            <!-- CELULAR -->
            <td fd-table-cell>
              {{ c.celular }}
            </td>

            <!-- FECHA -->
            <td fd-table-cell class="info">
              {{ c.creado?.nombre }}: {{ c.creado?.fecha | date: 'dd/MM/yy, HH:mm' }}
            </td>

            <!-- ACCIONES -->
            <td
              fd-table-cell
              class="fd-table__cell--activable fd-table__cell--fit-content fd-table__cell--no-padding"
            >
              <i fd-table-icon glyph="slim-arrow-right" title="Navigate" (click)="verFicha(c)"> </i>
            </td>
          </tr>
        </tbody>

        <!-- FOOTER -->
        <tfoot fd-table-footer>
          <tr fd-table-row>
            <td fd-table-cell colspan="100">
              <fd-pagination
                *ngIf="totalItems > 0"
                ariaLabel="Paginación"
                [totalItems]="totalItems"
                [itemsPerPage]="pageSize"
                [currentPage]="page"
                (currentPageChange)="onPageChange($event)"
              >
              </fd-pagination>
            </td>
          </tr>
        </tfoot>
      </table>
    </fd-busy-indicator>
  </fd-dynamic-page-content>
</fd-dynamic-page>
